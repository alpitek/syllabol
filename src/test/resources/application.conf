
pekko {
  actor {
    provider = "local"

    serializers {
      jackson-json = "org.apache.pekko.serialization.jackson.JacksonJsonSerializer",
      jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer",
    }
    serialization-bindings {
      "info.a24731.syllabol.persistence.PersistenceSerialization" = jackson-cbor,
    }
  }

  persistence {
    journal.plugin = "pekko.persistence.journal.inmem"
    snapshot-store.plugin = "pekko.persistence.snapshot-store.local"
    snapshot-store.local.dir = "target/snapshots-"${?user.name}
  }
}
